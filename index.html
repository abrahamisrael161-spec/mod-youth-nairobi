<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOD Youths Nairobi</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 50%, #075E54 100%);
            font-family: 'Arial', sans-serif;
            color: white;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }
        .title {
            font-size: 2.2rem;
            margin-bottom: 25px;
            animation: bounce 2s infinite alternate;
            line-height: 1.4;
        }
        .time {
            font-size: 1.6rem;
            margin: 15px 0;
            color: #FFE135;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
        .invite {
            font-size: 1.8rem;
            margin-top: 25px;
            animation: pulse 1.5s infinite alternate;
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 30px;
        }
        .emoji {
            font-size: 2.5rem;
            margin: 0 8px;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        .footer {
            margin-top: 30px;
            font-size: 1rem;
            color: #E8F5E9;
        }
    </style>
</head>
<body>
    <div class="title">
        <span class="emoji">✨</span> WELCOME TO <br> MOD YOUTHS NAIROBI <span class="emoji">🌟</span>
    </div>

    <div class="time">
        <span class="emoji">⏰</span> EVERY SUNDAY <br> 7:30 AM - 9:00 AM <span class="emoji">☀️</span>
    </div>

    <div class="invite">
        <span class="emoji">🤝</span> BRING A FRIEND <span class="emoji">🎉</span>
    </div>

    <div class="footer">
        See you there! 🥳
    </div>
</body>
</html>
